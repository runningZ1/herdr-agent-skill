name: Checks
on: [push, pull_request]
jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B tests/test_adapter.py
      - run: python -B tests/test_socket_api.py
      - run: python -B tests/test_auto_name.py
      - run: python -B tests/test_tools.py
      - run: python -B tools/validate.py
      - run: python -B tools/build.py --verify
